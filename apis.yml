aid: artian
name: Artian
description: Artian AI builds enterprise-grade agentic AI systems for financial services,
  letting banks, brokerages, insurers and other regulated institutions turn complex,
  business-critical workflows into autonomous multi-agent operations with humans fully
  in control. The platform pairs an AI Agent Builder and autonomous planner with domain-specific
  Workflow Agents, and ships governance as a first-class feature - end-to-end data
  lineage, model risk management, immutable audit logs, in-band policy guardrails and
  circuit breakers - so agents can operate safely inside strict regulatory and data-residency
  boundaries. Artian deploys on-prem or into a customer VPC on Kubernetes rather than
  as a public multi-tenant service, and interoperates via REST, MCP and A2A. Founded
  in 2023 and headquartered in New York, it is backed by Anthemis, Foxe Capital, Work-Bench
  and Wormhole Capital.
